<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | S3NT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>S3NT</h1>
            <p class="subtitle">Sign in securely with the S3NT user pool.</p>
    <p id="auth-status" role="status" aria-live="polite"></p>

    <section id="profile" hidden aria-labelledby="profile-heading">
      <h2 id="profile-heading">Your profile</h2>
      <p id="profile-name"></p>
      <p id="profile-id"></p>
    </section>

    <button id="sign-in" type="button" class="auth-submit primary-button">
      Sign in with Cognito
            </button>

            <p class="auth-link">
                Need an account? Contact an S3NT administrator.
            </p>

        </section>

    </main>
    <script src="js/auth.js" defer></script>

</body>
</html>
