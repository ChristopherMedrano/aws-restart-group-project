<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Created Tasks | S3NT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">

<div class="navbar-container">
    
<a href="dashboard.html" class="logo">S3NT</a>
<nav class="nav-links">
<a href="dashboard.html" class="nav-link">Assigned Tasks</a>
<a href="created-tasks.html" class="nav-link active">Created Tasks</a>
<a href="settings.html" class="nav-link">Settings</a>
<button id="logout-button" class="nav-link logout-button" type="button">Logout</button>

</nav>

</div>

</header>

<main class="dashboard-container">

<section class="dashboard-header">

<div>

<h1>Welcome back, <span id="user-name">User</span></h1>
<p>View and manage the tasks you created.</p>

</div>
<button id="create-task-button" class="primary-button" type="button">+ Create Task</button>

</section>

<section class="tasks-section">
<div class="section-header">
<div>

<h2>Created Tasks</h2>
<p>View tasks you created and check their notification results.</p>

</div>

</div>

<div class="task-filters">

<button class="filter-button active" data-filter="all" type="button">All</button>
<button class="filter-button" data-filter="open" type="button">Open</button>
<button class="filter-button" data-filter="complete" type="button">Completed</button>

</div>

<div id="task-list" class="task-list"></div>

</section>

</main>

<!-- Notification Outcome Modal -->
<div id="notification-modal" class="modal hidden">
    <div class="modal-content notification-modal-content">

        <div class="modal-header">
            <div>
                <h2>Notification Outcome</h2>
                <p>View the email notification result for this task.</p>
            </div>

            <button
                id="close-notification-modal"
                class="close-button"
                type="button"
            >
                &times;
            </button>
        </div>

        <div class="notification-result">
            <p id="notification-status"></p>
        </div>

        <div class="modal-actions">
            <button
                id="close-notification-button"
                class="secondary-button"
                type="button"
            >
                Close
            </button>
        </div>

    </div>
</div>

<script src="js/auth.js"></script>

<script src="js/created-tasks.js"></script>

</body>

</html>
