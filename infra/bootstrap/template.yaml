AWSTemplateFormatVersion: "2010-09-09"
Description: S3NT shared-dev bootstrap (artifact bucket, app deployer, CloudFormation execution role)

Parameters:
  ProjectTag:
    Type: String
    Default: S3NT
  EnvironmentTag:
    Type: String
    Default: shared-dev
  TrustedPrincipalArns:
    Type: CommaDelimitedList
    Description: IAM user or role ARNs allowed to assume AppDeployerRole. No account root. Not attached by this template.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: ManagedBy
          Value: SAM

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: s3nt-shared-dev-cfn-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: ManagedBy
          Value: SAM
      Policies:
        - PolicyName: DenyAdministratorAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyAdministratorAccess
                Effect: Deny
                Action:
                  - iam:AttachRolePolicy
                  - iam:AttachUserPolicy
                  - iam:AttachGroupPolicy
                Resource: "*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/AdministratorAccess
        - PolicyName: ManageS3ntAppIamRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: IamRoleCrud
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/s3nt-app-*"
              - Sid: AttachLambdaBasicOnly
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/s3nt-app-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassLambdaRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/s3nt-app-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
        - PolicyName: ManageS3ntAppResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDbTables
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:UpdateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/s3nt-app-*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/s3nt-app-*/index/*"
              - Sid: LambdaFunctions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:s3nt-app-*"
              - Sid: CognitoCreatePool
                Effect: Allow
                Action: cognito-idp:CreateUserPool
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: CognitoUserPools
                Effect: Allow
                Action:
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:DescribeUserPoolDomain
                  - cognito-idp:CreateResourceServer
                  - cognito-idp:DeleteResourceServer
                  - cognito-idp:DescribeResourceServer
                  - cognito-idp:UpdateResourceServer
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:ListTagsForResource
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              - Sid: HttpApis
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis/*"
              - Sid: LambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogStreams
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsLogGroup
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/s3nt-app-*"
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: ArtifactGetObject
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"

  AppDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: s3nt-shared-dev-app-deployer
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArns
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: ManagedBy
          Value: SAM
      Policies:
        - PolicyName: DeployS3ntApp
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationS3ntApp
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStackResources
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/s3nt-app"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/s3nt-app/*"
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: ArtifactObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: GetCloudFormationRole
                Effect: Allow
                Action: iam:GetRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: GetAppFunctionRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/s3nt-app-*"

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  AppDeployerRoleArn:
    Value: !GetAtt AppDeployerRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
