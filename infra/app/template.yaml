AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "S3NT shared-dev app stack (Task API, assignment SNS, notification SES)"

Parameters:
  LocalOrigin:
    Type: String
    Default: http://localhost:5173
  DeployedOrigin:
    Type: String
    Default: ""
    Description: CloudFront origin https://dxxxx.cloudfront.net with no trailing slash. Empty until s3nt-web exists.
  SesFromEmail:
    Type: String
    Description: "Verified SES From address in us-east-2. In sandbox, verify each recipient too."

Conditions:
  HasDeployedOrigin: !Not [!Equals [!Ref DeployedOrigin, ""]]

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
    Tags:
      Project: S3NT
      Environment: shared-dev
      ManagedBy: SAM

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: directoryPk
          AttributeType: S
        - AttributeName: displayNameKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: directoryPk-displayNameKey
          KeySchema:
            - AttributeName: directoryPk
              KeyType: HASH
            - AttributeName: displayNameKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  TasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
        - AttributeName: creatorId
          AttributeType: S
        - AttributeName: assigneeId
          AttributeType: S
        - AttributeName: createdSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: creatorId-createdSortKey
          KeySchema:
            - AttributeName: creatorId
              KeyType: HASH
            - AttributeName: createdSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: assigneeId-createdSortKey
          KeySchema:
            - AttributeName: assigneeId
              KeyType: HASH
            - AttributeName: createdSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
        - AttributeName: historyRecipientId
          AttributeType: S
        - AttributeName: historySortKey
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: historyRecipientId-historySortKey
          KeySchema:
            - AttributeName: historyRecipientId
              KeyType: HASH
            - AttributeName: historySortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  AssignmentTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: s3nt-app-assignment
      DisplayName: s3nt-app-assignment
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  NotificationInvokeFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: s3nt-app-notification-invoke-failure
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: s3nt-shared-dev
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: name
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolTags:
        Project: S3NT
        Environment: shared-dev
        ManagedBy: SAM

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "s3nt-shared-dev-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: shared-task-api
      Name: shared-task-api
      Scopes:
        - ScopeName: access
          ScopeDescription: Access the S3NT task API

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: s3nt-shared-dev-spa
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - shared-task-api/access
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs: !If
        - HasDeployedOrigin
        - - !Sub "${LocalOrigin}/callback"
          - !Sub "${DeployedOrigin}/callback"
        - - !Sub "${LocalOrigin}/callback"
      LogoutURLs: !If
        - HasDeployedOrigin
        - - !Sub "${LocalOrigin}/"
          - !Sub "${DeployedOrigin}/"
        - - !Sub "${LocalOrigin}/"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: !If
          - HasDeployedOrigin
          - - !Ref LocalOrigin
            - !Ref DeployedOrigin
          - - !Ref LocalOrigin
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 300
      Tags:
        Project: S3NT
        Environment: shared-dev
        ManagedBy: SAM

  TaskApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3nt-app-task-api
      CodeUri: ../../backend/task-api/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
          ASSIGNMENT_TOPIC_ARN: !Ref AssignmentTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - DynamoDBReadPolicy:
            TableName: !Ref NotificationsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AssignmentTopic.TopicName
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        PatchMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetAssignees:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /assignees
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        PostTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        PatchTaskStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{taskId}/status
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetTaskNotification:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{taskId}/notification
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3nt-app-post-confirmation
      CodeUri: ../../backend/post-confirmation/
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        PostConfirm:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation
        PostAuth:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostAuthentication

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3nt-app-notification
      CodeUri: ../../backend/notification/
      Handler: lambda_function.lambda_handler
      Timeout: 15
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
          SES_FROM_EMAIL: !Ref SesFromEmail
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TasksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationInvokeFailureQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SesFromEmail
      Events:
        Assignment:
          Type: SNS
          Properties:
            Topic: !Ref AssignmentTopic
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotificationInvokeFailureQueue.Arn

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomainUrl:
    Value: !Sub "https://s3nt-shared-dev-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  UsersTableName:
    Value: !Ref UsersTable
