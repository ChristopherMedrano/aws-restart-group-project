AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "S3NT shared-dev app stack (Task API routes; no SNS)"

Parameters:
  LocalOrigin:
    Type: String
    Default: http://localhost:5173

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
    Tags:
      Project: S3NT
      Environment: shared-dev
      ManagedBy: SAM

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: directoryPk
          AttributeType: S
        - AttributeName: displayNameKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: directoryPk-displayNameKey
          KeySchema:
            - AttributeName: directoryPk
              KeyType: HASH
            - AttributeName: displayNameKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  TasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
        - AttributeName: creatorId
          AttributeType: S
        - AttributeName: assigneeId
          AttributeType: S
        - AttributeName: createdSortKey
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: creatorId-createdSortKey
          KeySchema:
            - AttributeName: creatorId
              KeyType: HASH
            - AttributeName: createdSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: assigneeId-createdSortKey
          KeySchema:
            - AttributeName: assigneeId
              KeyType: HASH
            - AttributeName: createdSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: taskId
          AttributeType: S
        - AttributeName: historyRecipientId
          AttributeType: S
        - AttributeName: historySortKey
          AttributeType: S
      KeySchema:
        - AttributeName: taskId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: historyRecipientId-historySortKey
          KeySchema:
            - AttributeName: historyRecipientId
              KeyType: HASH
            - AttributeName: historySortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: S3NT
        - Key: Environment
          Value: shared-dev
        - Key: ManagedBy
          Value: SAM

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: s3nt-shared-dev
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: name
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolTags:
        Project: S3NT
        Environment: shared-dev
        ManagedBy: SAM

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "s3nt-shared-dev-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: shared-task-api
      Name: shared-task-api
      Scopes:
        - ScopeName: access
          ScopeDescription: Access the S3NT task API

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: s3nt-shared-dev-spa
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - shared-task-api/access
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub "${LocalOrigin}/callback"
      LogoutURLs:
        - !Sub "${LocalOrigin}/"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - !Ref LocalOrigin
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 300
      Tags:
        Project: S3NT
        Environment: shared-dev
        ManagedBy: SAM

  TaskApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3nt-app-task-api
      CodeUri: ../../backend/task-api/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - DynamoDBReadPolicy:
            TableName: !Ref NotificationsTable
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        PatchMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetAssignees:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /assignees
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        PostTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: POST
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetTasks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        PatchTaskStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{taskId}/status
            Method: PATCH
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetTaskNotification:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{taskId}/notification
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access
        GetNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: GET
            Auth:
              Authorizer: CognitoJwt
              AuthorizationScopes:
                - shared-task-api/access

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3nt-app-post-confirmation
      CodeUri: ../../backend/post-confirmation/
      Handler: lambda_function.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        PostConfirm:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation
        PostAuth:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostAuthentication

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: s3nt-app-notification
      CodeUri: ../../backend/notification/
      Handler: lambda_function.lambda_handler

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomainUrl:
    Value: !Sub "https://s3nt-shared-dev-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  UsersTableName:
    Value: !Ref UsersTable
