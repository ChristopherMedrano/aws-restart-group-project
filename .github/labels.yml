- name: "type:design"
  color: "C2E0C6"
  description: "UX, wireframe, or interaction design"
- name: "type:governance"
  color: "7057FF"
  description: "Gate, scope, risk, or decision governance"
- name: "type:observability"
  color: "006B75"
  description: "Logs, metrics, alarms, dashboards, or tracing"
- name: "type:project"
  color: "7057FF"
  description: "Project setup or coordination"
- name: "area:project"
  color: "7057FF"
  description: "Project governance and coordination"
- name: "area:platform"
  color: "006B75"
  description: "Shared AWS platform and deployment foundation"
- name: "area:iam"
  color: "B60205"
  description: "Human, deployment, runtime, or resource permissions"
- name: "area:identity"
  color: "1D76DB"
  description: "Cognito identity and profile provisioning"
- name: "area:api"
  color: "0052CC"
