- name: "type:infra"
  color: "006B75"
  description: "AWS infrastructure or deployment work"
- name: "type:test"
  color: "BFD4F2"
  description: "Test implementation, execution, or evidence"
- name: "type:docs"
  color: "0075CA"
  description: "Controlled documentation or runbook work"
- name: "type:security"
  color: "B60205"
  description: "Security verification or hardening"
- name: "type:architecture"
  color: "5319E7"
  description: "Architecture or cross-component design"
- name: "type:release"
  color: "1D76DB"
  description: "Release preparation or decision"
- name: "type:hardening"
  color: "D93F0B"
  description: "Reliability or production-readiness hardening"
- name: "type:operations"
  color: "0052CC"
  description: "Operational readiness or recovery work"
- name: "type:accessibility"
  color: "0E8A16"
