- name: "area:task-api"
  color: "0052CC"
  description: "Task API application behavior"
- name: "area:notification"
  color: "5319E7"
  description: "Notification Lambda, outcomes, and SES"
- name: "area:messaging"
  color: "5319E7"
  description: "SNS and asynchronous failure boundaries"
- name: "area:frontend"
  color: "1D76DB"
  description: "SPA behavior, browser authentication, and UX"
- name: "area:frontend-hosting"
  color: "006B75"
  description: "S3, CloudFront, routing, caching, and runtime configuration"
- name: "area:qa"
  color: "BFD4F2"
  description: "Traceability, validation, and release evidence"
- name: "area:operations"
  color: "0052CC"
  description: "Monitoring, recovery, and operational readiness"
- name: "area:release"
  color: "1D76DB"
  description: "Release candidate, final deployment, and handoff"
- name: "area:demo"
  color: "C2E0C6"
  description: "Demonstration, rehearsal, and presentation"
- name: "priority:p0"
  color: "B60205"
  description: "Gate blocker requiring immediate attention"
- name: "priority:p1"
  color: "D93F0B"
  description: "Required for the milestone outcome"
- name: "priority:p2"
  color: "FBCA04"
  description: "Approved follow-up work"
- name: "blocked"
  color: "000000"
  description: "Cannot progress until a stated dependency is resolved"
- name: "risk"
  color: "E99695"
  description: "Condition that could threaten scope, schedule, or quality"
- name: "stretch"
  color: "D4C5F9"
  description: "Post-Gate-5 experiment outside the release commitment"
