# Canonical GitHub labels for the delivery backlog.
- name: "type:epic"
  color: "3E4B9E"
  description: "Weekly delivery outcome with linked child issues"
- name: "type:defect"
  color: "D73A4A"
  description: "Verified behavior that differs from an approved contract"
- name: "type:change-request"
  color: "FBCA04"
  description: "Proposed contract, scope, architecture, or schedule change"
- name: "type:feature"
  color: "0E8A16"
