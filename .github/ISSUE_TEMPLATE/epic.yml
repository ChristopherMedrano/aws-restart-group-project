name: Weekly delivery epic
description: Track one canonical weekly outcome and its gate decision.
title: "[EPIC][Wn] "
labels:
  - "type:epic"
body:
  - type: markdown
    attributes:
      value: |
        Copy the matching canonical epic from `docs/project/SHARED_TASK_NOTIFICATIONS_GITHUB_EPICS_AND_ISSUES.md`.

        **Before creating:** synchronize `.github/labels.yml` into the target repository. If a canonical label is missing, create it with its exact name, color, and description from that file; do not invent a replacement label.

        **Labels for this form:** `type:epic` is added automatically. Add exactly one area from `area:project`, `area:platform`, `area:iam`, `area:identity`, `area:api`, `area:data`, `area:task-api`, `area:notification`, `area:messaging`, `area:frontend`, `area:frontend-hosting`, `area:qa`, `area:operations`, `area:release`, or `area:demo`, plus `priority:p0`. Add `blocked` or `risk` only when applicable. `stretch` is not valid for a planned weekly epic.

        **After creating:** use the matching canonical epic to set the GitHub assignee, milestone, labels, and Project fields. As each child issue is created, set its built-in **Parent issue** relationship to this epic (a `#123` reference alone is not sufficient).
  - type: input
    id: outcome
    attributes:
      label: Required outcome
      description: State the demonstrable end-of-week result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the objective epic acceptance criteria from the canonical backlog.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Tracking checklist and child issues
      description: Copy the canonical tracking checklist, then replace keys with links to the owned child issues.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite epics/issues, or enter None.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Link risk issues, or enter None identified at planning time.
    validations:
      required: true
  - type: input
    id: exit_gate
    attributes:
      label: Exit gate
      description: Name the gate or demonstrable weekly outcome that must be accepted.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Gate evidence and decision
      description: Gokila links evidence; Ruthvik records the accepted/not accepted decision.
    validations:
      required: true
  - type: textarea
    id: weekly_demonstration
    attributes:
      label: Weekly demonstration
      description: Copy the canonical demonstration and link its supporting evidence.
    validations:
      required: true
